basePath: /
definitions:
  internal_modules_auth.LoginInput:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  internal_modules_auth.RegisterInput:
    properties:
      channel_code:
        type: string
      email:
        type: string
      password:
        minLength: 6
        type: string
      referral_code:
        type: string
      restaurant_name:
        minLength: 2
        type: string
      role:
        type: string
    required:
    - email
    - password
    - restaurant_name
    type: object
  internal_modules_referral.CreateCodeInput:
    properties:
      code:
        type: string
      metadata:
        type: string
      program_code:
        type: string
    required:
    - program_code
    type: object
  internal_modules_referral.RedeemInput:
    properties:
      commission_ids:
        items:
          type: string
        type: array
      metadata:
        type: string
    type: object
  internal_modules_studio.CreateGenerationJobInput:
    properties:
      generation_strategy:
        type: string
      idempotency_key:
        type: string
      input_mode:
        enum:
        - text_to_image
        - image_to_image
        - multi_image
        - image_edit
        - ask_for_required_input
        type: string
      metadata:
        additionalProperties: {}
        type: object
      mode:
        enum:
        - single
        - batch
        - variation
        - refinement
        type: string
      params:
        additionalProperties: {}
        type: object
      parent_job_id:
        type: string
      parent_variant_id:
        type: string
      prompt:
        type: string
      provider:
        type: string
      requested_variants:
        type: integer
      source_asset_ids:
        items:
          type: string
        type: array
      source_assets:
        items:
          $ref: '#/definitions/internal_modules_studio.SourceAssetInput'
        type: array
      style_preset_id:
        type: string
    required:
    - mode
    type: object
  internal_modules_studio.CreateStylePresetInput:
    properties:
      description:
        type: string
      dimensions:
        items:
          $ref: '#/definitions/internal_modules_studio.StyleDimension'
        type: array
      execution_profile:
        $ref: '#/definitions/internal_modules_studio.StyleExecutionProfile'
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      preview_asset_id:
        type: string
      tags:
        items:
          type: string
        type: array
      visibility:
        enum:
        - private
        - organization
        - public
        type: string
    required:
    - name
    - visibility
    type: object
  internal_modules_studio.ForkStylePresetInput:
    properties:
      execution_profile:
        $ref: '#/definitions/internal_modules_studio.StyleExecutionProfile'
      name:
        type: string
      visibility:
        enum:
        - private
        - organization
        - public
        type: string
    type: object
  internal_modules_studio.RecordJobResultsInput:
    properties:
      error_code:
        type: string
      error_message:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      progress:
        type: integer
      status:
        enum:
        - processing
        - completed
        - failed
        - canceled
        type: string
      variants:
        items:
          $ref: '#/definitions/internal_modules_studio.RecordJobVariantInput'
        type: array
    required:
    - status
    type: object
  internal_modules_studio.RecordJobVariantInput:
    properties:
      asset:
        $ref: '#/definitions/internal_modules_studio.RegisterAssetInput'
      index:
        type: integer
      is_selected:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      parent_variant_id:
        type: string
      score:
        type: number
      status:
        enum:
        - pending
        - ready
        - failed
        type: string
    required:
    - index
    - status
    type: object
  internal_modules_studio.RegisterAssetInput:
    properties:
      asset_type:
        enum:
        - source
        - generated
        - mask
        - reference
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      height:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      mime_type:
        type: string
      preview_url:
        type: string
      source_type:
        enum:
        - upload
        - import
        - generated
        type: string
      source_url:
        type: string
      storage_key:
        type: string
      width:
        type: integer
    required:
    - asset_type
    - source_type
    type: object
  internal_modules_studio.SelectVariantInput:
    properties:
      variant_id:
        type: string
    required:
    - variant_id
    type: object
  internal_modules_studio.SourceAssetInput:
    properties:
      asset_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      required:
        type: boolean
      role:
        type: string
      weight:
        type: number
    type: object
  internal_modules_studio.StyleDimension:
    properties:
      key:
        type: string
      label:
        type: string
      type:
        type: string
    type: object
  internal_modules_studio.StyleExecutionProfile:
    properties:
      model:
        type: string
      negative_prompt_template:
        type: string
      parameter_profile:
        additionalProperties: {}
        type: object
      prompt_template:
        type: string
      provider:
        type: string
      style_prompt:
        type: string
      system_prompt:
        type: string
      user_prompt:
        type: string
      variables:
        additionalProperties:
          type: string
        type: object
    type: object
  internal_modules_studio.UpdateJobRuntimeInput:
    properties:
      error_code:
        type: string
      error_message:
        type: string
      eta_seconds:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      progress:
        type: integer
      provider_job_id:
        type: string
      queue_position:
        type: integer
      stage:
        type: string
      stage_message:
        type: string
      status:
        type: string
    type: object
  internal_modules_templatecenter.CopyTemplateInput:
    properties:
      name:
        type: string
      visibility:
        type: string
    type: object
  internal_modules_templatecenter.UseTemplateInput:
    properties:
      custom_copy:
        additionalProperties:
          type: string
        type: object
      language:
        type: string
      source_asset_ids:
        items:
          type: string
        type: array
      source_assets:
        items:
          $ref: '#/definitions/menu-service_internal_modules_studio.SourceAssetInput'
        type: array
      target_platform:
        type: string
      upload_image_url:
        type: string
    required:
    - target_platform
    type: object
  internal_modules_user.UpdateProfileInput:
    properties:
      language_preference:
        enum:
        - en
        - zh
        - th
        type: string
      name:
        type: string
      restaurant_name:
        type: string
    type: object
  menu-service_internal_modules_studio.SourceAssetInput:
    properties:
      asset_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      required:
        type: boolean
      role:
        type: string
      weight:
        type: number
    type: object
  menu-service_pkg_response.ErrorResponse:
    properties:
      code:
        $ref: '#/definitions/menu-service_pkg_response.ResponseCode'
      error:
        type: string
      error_code:
        type: string
      error_hint:
        type: string
      errors:
        items:
          $ref: '#/definitions/menu-service_pkg_response.FieldError'
        type: array
      message:
        type: string
      request_id:
        type: string
      timestamp:
        type: integer
    type: object
  menu-service_pkg_response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      value:
        type: string
    type: object
  menu-service_pkg_response.ResponseCode:
    enum:
    - 0
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 2000
    - 2001
    - 5000
    - 5001
    - 5002
    - 5003
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeInvalidParameter
    - CodeUnauthorized
    - CodeBadRequest
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeMethodNotAllowed
    - CodeTooManyRequests
    - CodeMissingParameter
    - CodeBusinessError
    - CodeExternalDependency
    - CodeInternalError
    - CodeDatabaseError
    - CodeThirdPartyError
    - CodeServiceUnavailable
  menu-service_pkg_response.SuccessResponse:
    properties:
      code:
        $ref: '#/definitions/menu-service_pkg_response.ResponseCode'
      data: {}
      message:
        type: string
      request_id:
        type: string
      timestamp:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Frontend-facing APIs for Menu AI P0 auth, session, and credits flows.
    Product workflows stay in menu-backend while shared identity/org/wallet truth stays in v-platform-backend.
  title: Menu Backend API
  version: 0.1.0
paths:
  /api/v1/menu/auth/login:
    post:
      consumes:
      - application/json
      description: Frontend-facing login endpoint backed by platform identity.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      summary: Login menu user
      tags:
      - Auth
  /api/v1/menu/auth/register:
    post:
      consumes:
      - application/json
      description: Frontend-facing register endpoint. Menu orchestrates platform user/org
        creation and optional signup bonus issuance.
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      summary: Register menu user
      tags:
      - Auth
  /api/v1/menu/auth/session:
    get:
      description: Resolve current authenticated user, current organization, and current
        credits balance for frontend bootstrap.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current session
      tags:
      - Auth
  /api/v1/menu/referrals/codes/{code}/resolve:
    get:
      description: Resolve a referral code before signup and return reward policy
        details for the current Menu product.
      parameters:
      - description: Referral code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      summary: Resolve referral code
      tags:
      - Referral
  /api/v1/menu/referrals/me/codes:
    get:
      description: List referral codes owned by the current organization with optional
        program and status filters.
      parameters:
      - description: Program code filter
        in: query
        name: program_code
        type: string
      - description: Code status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List referral codes
      tags:
      - Referral
    post:
      consumes:
      - application/json
      description: Create a new referral code for the current organization and selected
        program.
      parameters:
      - description: Create referral code request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_referral.CreateCodeInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create referral code
      tags:
      - Referral
  /api/v1/menu/referrals/me/codes/ensure:
    post:
      consumes:
      - application/json
      description: Idempotently ensure the current organization has an active referral
        code for the selected program.
      parameters:
      - description: Ensure referral code request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_referral.CreateCodeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ensure referral code
      tags:
      - Referral
  /api/v1/menu/referrals/me/commissions:
    get:
      description: List referral commissions for the current organization with optional
        status filtering.
      parameters:
      - description: Commission status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List commissions
      tags:
      - Referral
  /api/v1/menu/referrals/me/commissions/redeem:
    post:
      consumes:
      - application/json
      description: Redeem earned referral commissions into the configured Menu reward
        asset for the current organization.
      parameters:
      - description: Redeem commissions request
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_modules_referral.RedeemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Redeem commissions
      tags:
      - Referral
  /api/v1/menu/referrals/me/conversions:
    get:
      description: List referral conversions for the current organization with optional
        status filtering.
      parameters:
      - description: Conversion status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List referral conversions
      tags:
      - Referral
  /api/v1/menu/referrals/me/overview:
    get:
      description: Load current organization referral overview including programs,
        codes, conversions, commissions, and aggregate commission metrics.
      parameters:
      - description: Conversion status filter
        in: query
        name: conversion_status
        type: string
      - description: Commission status filter
        in: query
        name: commission_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get referral overview
      tags:
      - Referral
  /api/v1/menu/referrals/programs:
    get:
      description: List active or filtered referral programs available to the current
        Menu product.
      parameters:
      - default: active
        description: Program status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List referral programs
      tags:
      - Referral
  /api/v1/menu/studio/assets:
    get:
      description: List source/generated/mask/reference Studio assets for the current
        Menu organization.
      parameters:
      - description: 'Filter by asset type: source, generated, mask, reference'
        in: query
        name: asset_type
        type: string
      - description: Filter by asset status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Studio assets
      tags:
      - Studio
    post:
      consumes:
      - application/json
      description: Register a Menu-owned Studio asset after upload/import; platform
        storage remains the storage truth.
      parameters:
      - description: Studio asset registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_studio.RegisterAssetInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a Studio asset
      tags:
      - Studio
  /api/v1/menu/studio/history/jobs:
    get:
      description: Return job/result history with source/result assets for Menu History
        and Library UX.
      parameters:
      - description: Filter by job status
        in: query
        name: status
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Studio job history
      tags:
      - Studio
  /api/v1/menu/studio/jobs:
    get:
      description: List Menu Studio generation jobs for the current user/org.
      parameters:
      - description: Filter by job status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu-service_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/menu-service_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Studio generation jobs
      tags:
      - Studio
    post:
      consumes:
      - application/json
      description: Create a Menu Studio generation job. Input mode is resolved from
